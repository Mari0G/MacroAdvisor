name: Android quality

on:
  workflow_call:
    inputs:
      build_flavor:
        description: Android distribution flavor to compile.
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Format, analyze, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build Android verification APK
        run: >-
          flutter build apk --debug --flavor ${{ inputs.build_flavor }}
          --build-number=${{ github.run_number }}
