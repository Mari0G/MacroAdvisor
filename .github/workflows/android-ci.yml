name: Android CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/android-quality.yml
    with:
      build_flavor: preview
