name: Android preview

on:
  push:
    branches:
      - develop

permissions:
  contents: write

concurrency:
  group: android-preview-develop
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/android-quality.yml
    with:
      build_flavor: preview

  publish-preview:
    name: Build and publish preview
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          cache: true

      - name: Fetch dependencies
        run: flutter pub get

      - name: Determine preview version
        id: version
        shell: bash
        run: |
          version=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          test -n "$version"
          echo "name=${version}-dev.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      - name: Configure signing when available
        id: signing
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" || -z "$ANDROID_KEY_ALIAS" || -z "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          keystore_path="$RUNNER_TEMP/macroadvisor-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          {
            echo "storeFile=$keystore_path"
            echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
            echo "keyAlias=$ANDROID_KEY_ALIAS"
            echo "keyPassword=$ANDROID_KEY_PASSWORD"
          } > android/key.properties
          echo "configured=true" >> "$GITHUB_OUTPUT"

      - name: Build signed preview packages
        if: steps.signing.outputs.configured == 'true'
        run: |
          flutter build apk --release --flavor preview --build-name=${{ steps.version.outputs.name }} --build-number=${{ github.run_number }}
          flutter build appbundle --release --flavor preview --build-name=${{ steps.version.outputs.name }} --build-number=${{ github.run_number }}

      - name: Build debug-signed preview APK
        if: steps.signing.outputs.configured != 'true'
        run: >-
          flutter build apk --debug --flavor preview
          --build-name=${{ steps.version.outputs.name }}
          --build-number=${{ github.run_number }}

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: macroadvisor-preview-${{ steps.version.outputs.name }}
          path: build/app/outputs/flutter-apk/app-preview-*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Pre-Release
        if: steps.signing.outputs.configured == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.version.outputs.name }}
          APK: build/app/outputs/flutter-apk/app-preview-release.apk
          AAB: build/app/outputs/bundle/previewRelease/app-preview-release.aab
        shell: bash
        run: |
          sha256sum "$APK" "$AAB" > SHA256SUMS.txt
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$APK" "$AAB" SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" "$APK" "$AAB" SHA256SUMS.txt --target "$GITHUB_SHA" --title "$TAG" --generate-notes --prerelease
          fi
