name: macro_advisor
description: "A local-first nutrition tracking app with editable AI estimates."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  drift: ^2.34.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.3.2
  flutter_secure_storage: ^10.3.1
  image: ^4.7.2
  image_picker: ^1.2.1
  intl: ^0.20.2

dev_dependencies:
  # 2.15.2 requires analyzer/meta versions newer than Flutter 3.44.6 pins.
  build_runner: 2.15.1
  # 2.34.1+ requires analyzer 13, which conflicts with flutter_test 3.44.6.
  drift_dev: 2.34.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
