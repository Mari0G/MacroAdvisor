<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MacroAdvisor – UI-Prototyp</title>
  <!-- Throwaway prototype: Three radically different app styles, switchable via ?variant=A|B|C. -->
  <style>
    *{box-sizing:border-box} :root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:#17231f;background:#e8ebe8} body{margin:0;min-height:100vh}
    button,input{font:inherit} button{cursor:pointer} button:focus-visible,[tabindex]:focus-visible{outline:3px solid #ffb341;outline-offset:2px}
    .stage{min-height:100vh;padding:24px 16px 104px;display:grid;place-items:start center;background:var(--stage)}
    .phone{width:min(100%,430px);min-height:820px;background:var(--bg);color:var(--ink);border-radius:38px;overflow:hidden;box-shadow:0 30px 80px #17231f2c;position:relative;border:1px solid var(--line)}
    .status{height:34px;padding:10px 22px 0;display:flex;justify-content:space-between;font-size:12px;font-weight:750}.app{min-height:786px;display:flex;flex-direction:column}.screen{padding:10px 20px 112px;flex:1}.top{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.top h1{font-size:29px;line-height:1.05;margin:0;letter-spacing:-.04em}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;font-weight:800;color:var(--muted)}
    .spacer{flex:1}.icon{width:48px;height:48px;border:0;border-radius:16px;background:transparent;color:inherit;font-size:20px}.icon:hover{background:var(--soft)}
    .date-strip{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}.date-strip button{border:0;background:transparent;color:inherit;width:48px;height:48px;border-radius:16px}.date-main{text-align:center}.date-main b{display:block}.date-main small{color:var(--muted)}
    .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}.section-title{display:flex;align-items:end;justify-content:space-between;margin:22px 2px 10px}.section-title h2{margin:0;font-size:18px;letter-spacing:-.02em}.section-title button{border:0;background:transparent;color:var(--accent);font-weight:750}
    .hero{position:relative;overflow:hidden;padding:22px;margin-bottom:12px}.hero .kcal{font-size:42px;line-height:1;font-weight:820;letter-spacing:-.06em}.hero .unit{font-size:15px;color:var(--muted);font-weight:650}.hero p{margin:7px 0 0;color:var(--muted);font-size:13px}.ring{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--accent) 0 68%,var(--soft) 68%);position:absolute;right:18px;top:17px}.ring:after{content:"68%";display:grid;place-items:center;width:68px;height:68px;border-radius:50%;background:var(--card);font-weight:800}
    .macros{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.macro{padding:13px 11px}.macro strong{display:block;font-size:19px}.macro span{font-size:11px;color:var(--muted)}.bar{height:6px;border-radius:8px;background:var(--soft);overflow:hidden;margin-top:10px}.bar i{display:block;height:100%;width:var(--p);background:var(--tone,var(--accent));border-radius:8px}
    .meal{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding:12px}.meal-art{width:52px;height:52px;border-radius:15px;background:var(--meal);display:grid;place-items:center;font-size:23px}.meal-copy{min-width:0;flex:1}.meal-copy b,.meal-copy small{display:block}.meal-copy small{color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meal-kcal{text-align:right}.meal-kcal b{font-size:15px}.meal-kcal small{color:var(--muted)}
    .fab{position:absolute;right:20px;bottom:22px;border:0;border-radius:18px;min-height:56px;padding:0 20px;background:var(--accent);color:var(--accentInk);font-weight:800;box-shadow:0 12px 28px var(--accentShadow);display:flex;align-items:center;gap:9px;z-index:5}.fab span{font-size:23px}.bottomnav{position:absolute;bottom:0;left:0;right:0;height:84px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(18px);display:flex;justify-content:space-around;padding:10px 78px 18px 10px;border-top:1px solid var(--line)}.bottomnav button{border:0;background:transparent;color:var(--muted);min-width:64px;font-size:11px;font-weight:750}.bottomnav b{display:block;font-size:20px;margin-bottom:3px}.bottomnav .active{color:var(--accent)}
    .switcher{position:fixed;z-index:50;bottom:18px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:8px;padding:7px;border-radius:999px;background:#111914;color:white;box-shadow:0 12px 36px #0005;font-size:13px}.switcher button{border:0;border-radius:50%;width:40px;height:40px;background:#29342d;color:white;font-size:20px}.switcher .label{min-width:174px;text-align:center}.switcher small{display:block;color:#aebbb3}
    .palette-switcher{position:fixed;z-index:49;bottom:78px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:6px;padding:7px;border-radius:18px;background:#111914;color:white;box-shadow:0 10px 28px #0004;font:700 11px/1 Inter,ui-sans-serif,system-ui,sans-serif}.palette-switcher button{display:flex;align-items:center;gap:6px;border:1px solid transparent;border-radius:11px;padding:8px 9px;background:transparent;color:#c7d0ca}.palette-switcher button:before{content:"";width:10px;height:10px;border-radius:50%;background:var(--swatch);box-shadow:0 0 0 2px #ffffff22}.palette-switcher button.active{border-color:#ffffff45;background:#ffffff14;color:white}.palette-switcher strong{padding:0 4px 0 2px}body:not([data-v="C"]) .palette-switcher{display:none}
    .sheet-wrap{position:absolute;inset:0;z-index:20;background:#0d1711a6;display:flex;align-items:flex-end}.sheet{width:100%;background:var(--bg);border-radius:30px 30px 0 0;padding:12px 20px 28px;animation:up .2s ease}.grab{width:44px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 18px}.sheet h2{margin:0 0 5px;font-size:24px}.sheet>p{margin:0 0 18px;color:var(--muted)}.choice{width:100%;border:1px solid var(--line);background:var(--card);color:inherit;border-radius:18px;padding:15px;margin:7px 0;text-align:left;display:flex;gap:14px;align-items:center}.choice i{font-style:normal;font-size:23px;width:36px}.choice b,.choice small{display:block}.choice small{color:var(--muted);margin-top:3px}.close{position:absolute;right:18px;top:16px}
    .form-label{font-size:13px;font-weight:800;margin:16px 0 7px;display:block}.textarea{width:100%;min-height:132px;border:1px solid var(--line);border-radius:18px;background:var(--card);color:inherit;padding:15px;resize:none}.primary,.secondary{width:100%;min-height:52px;border-radius:16px;font-weight:800;margin-top:12px}.primary{border:0;background:var(--accent);color:var(--accentInk)}.secondary{border:1px solid var(--line);background:transparent;color:inherit}.notice{display:flex;gap:10px;background:var(--notice);border-radius:16px;padding:13px;font-size:13px;line-height:1.4}.notice b{display:block}.item-row{display:flex;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);padding:14px 0}.item-row:last-child{border:0}.item-row small{color:var(--muted);display:block;margin-top:3px}.total-row{display:flex;justify-content:space-between;margin:11px 0}.success{padding:36px 24px;text-align:center}.success .check{width:82px;height:82px;display:grid;place-items:center;margin:90px auto 20px;border-radius:50%;background:var(--accent);color:var(--accentInk);font-size:38px}
    .seg{display:flex;background:var(--soft);padding:4px;border-radius:15px;gap:3px}.seg button{flex:1;border:0;background:transparent;color:var(--muted);border-radius:12px;padding:10px 5px;font-size:12px;font-weight:750}.seg .active{background:var(--card);color:var(--ink);box-shadow:0 2px 8px #0001}.chart{height:190px;display:flex;align-items:end;gap:9px;padding:18px 6px 2px}.col{flex:1;text-align:center;color:var(--muted);font-size:10px}.col i{display:block;height:var(--h);background:var(--accent);border-radius:8px 8px 3px 3px;margin-bottom:6px;opacity:var(--o,1)}.setting{display:flex;gap:13px;align-items:center;padding:14px 2px;border-bottom:1px solid var(--line)}.setting .sicon{width:42px;height:42px;border-radius:13px;background:var(--soft);display:grid;place-items:center}.setting div:nth-child(2){flex:1}.setting small{color:var(--muted);display:block;margin-top:3px}.toggle{width:46px;height:28px;border-radius:20px;border:0;background:var(--accent);padding:3px}.toggle:after{content:"";display:block;width:22px;height:22px;background:white;border-radius:50%;margin-left:18px}
    .dev-state{position:fixed;left:14px;top:14px;background:#111d;color:#d8e4dc;padding:8px 10px;border-radius:9px;font:11px/1.35 ui-monospace,monospace;z-index:60;max-width:180px;pointer-events:none}.hidden{display:none!important}@keyframes up{from{transform:translateY(30px);opacity:0}}

    body[data-v="A"]{--stage:#dbe8e2;--bg:#f8faf7;--ink:#17352d;--muted:#667972;--card:#fff;--line:#dce7e1;--soft:#e4f0ea;--accent:#087b62;--accentInk:white;--accentShadow:#087b6244;--meal:#e8cda9;--notice:#e7f3ee;--radius:20px;--shadow:0 5px 18px #315a4a0c}
    body[data-v="A"] .hero{background:linear-gradient(135deg,#d9f0e7,#fff)}
    body[data-v="B"]{--stage:#ede5dc;--bg:#fbf5ec;--ink:#27201b;--muted:#756a61;--card:#fffaf2;--line:#ded2c5;--soft:#eee3d6;--accent:#d75935;--accentInk:#fffaf1;--accentShadow:#d7593544;--meal:#d9e8b8;--notice:#f8e4cf;--radius:4px;--shadow:none;font-family:Georgia,"Times New Roman",serif}
    body[data-v="B"] .phone{border-radius:8px}.status,.eyebrow,.macro,.meal-kcal,.switcher,.bottomnav,.primary,.secondary,.choice,.form-label,.seg{font-family:Inter,ui-sans-serif,system-ui,sans-serif}body[data-v="B"] .top h1{font-size:36px;font-weight:500}body[data-v="B"] .hero{border-width:2px;border-color:var(--ink);background:transparent}body[data-v="B"] .ring{border-radius:3px;background:var(--accent);transform:rotate(2deg)}body[data-v="B"] .ring:after{border-radius:2px;background:var(--bg)}body[data-v="B"] .card{border-left:0;border-right:0}body[data-v="B"] .macros{display:block}body[data-v="B"] .macro{display:grid;grid-template-columns:1fr 70px;align-items:center;margin-top:6px}body[data-v="B"] .macro .bar{grid-column:1/-1}body[data-v="B"] .meal-art{border-radius:2px}body[data-v="B"] .fab{border-radius:3px}
    body[data-v="C"]{--stage:#dcdcf1;--bg:#111325;--ink:#f6f4ff;--muted:#a9a9c0;--card:#1b1e36;--line:#303450;--soft:#292c49;--accent:#b7f36b;--accentInk:#14200b;--accentShadow:#b7f36b33;--meal:#513f72;--notice:#282c4b;--radius:24px;--shadow:0 8px 24px #0003}
    body[data-v="C"][data-palette="ocean"]{--stage:#cfdae8;--bg:#091523;--ink:#f1f8ff;--muted:#9aadc1;--card:#122238;--line:#28405a;--soft:#1a3049;--accent:#58d7ff;--accentInk:#05202a;--accentShadow:#58d7ff40;--meal:#174b69;--notice:#152d43}
    body[data-v="C"][data-palette="coral"]{--stage:#ead8d3;--bg:#211316;--ink:#fff5f1;--muted:#c3a6a1;--card:#321c21;--line:#55323a;--soft:#43262d;--accent:#ff906d;--accentInk:#2a0d06;--accentShadow:#ff906d40;--meal:#6a342f;--notice:#44252a}
    body[data-v="C"][data-palette="violet"]{--stage:#dfd4e9;--bg:#171021;--ink:#fbf4ff;--muted:#b9a6c5;--card:#281936;--line:#49305e;--soft:#38234a;--accent:#dfa1ff;--accentInk:#260d32;--accentShadow:#dfa1ff40;--meal:#56316b;--notice:#352047}
    body[data-v="C"] .phone{border:5px solid #080916}body[data-v="C"] .screen{padding-left:16px;padding-right:16px}body[data-v="C"] .hero{background:linear-gradient(145deg,#262a4d,#181a2e)}body[data-v="C"] .hero:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;background:#7357ff55;filter:blur(15px);right:-60px;bottom:-80px}body[data-v="C"] .macros{grid-template-columns:1fr 1fr}body[data-v="C"] .macro:first-child{grid-column:1/-1}body[data-v="C"] .meal{border:0;background:transparent;box-shadow:none}body[data-v="C"] .meal-art{border-radius:50%}body[data-v="C"] .bottomnav{left:14px;right:14px;bottom:12px;border:1px solid var(--line);border-radius:24px;height:74px;padding-bottom:10px}body[data-v="C"] .fab{bottom:102px;border-radius:50%;width:58px;padding:0;justify-content:center}body[data-v="C"] .fab em{display:none}
    body[data-v="C"][data-palette="ocean"] .hero{background:linear-gradient(145deg,#173653,#0d1c2e)}body[data-v="C"][data-palette="ocean"] .hero:before{background:#1ea7ff55}body[data-v="C"][data-palette="coral"] .hero{background:linear-gradient(145deg,#4a2428,#28161a)}body[data-v="C"][data-palette="coral"] .hero:before{background:#ff654e55}body[data-v="C"][data-palette="violet"] .hero{background:linear-gradient(145deg,#402457,#21152e)}body[data-v="C"][data-palette="violet"] .hero:before{background:#c552ff55}
    @media(min-width:840px){.phone{width:min(1120px,calc(100vw - 48px));min-height:760px;border-radius:28px}.app{min-height:726px}.screen{padding:12px 32px 100px}.dashboard{display:grid;grid-template-columns:minmax(320px,.85fr) 1.15fr;gap:24px}.dashboard .left,.dashboard .right{min-width:0}.top h1{font-size:34px}.fab{bottom:24px}.sheet{max-width:520px;margin:auto;border-radius:30px 30px 0 0}.dev-state{display:block}}
    @media(max-width:520px){.stage{padding:0 0 96px}.phone{border-radius:0;min-height:100vh;border:0}.app{min-height:100vh}.dev-state{display:none}}
  </style>
</head>
<body data-v="A">
  <div class="stage"><main class="phone" id="phone"><div class="status"><span>9:41</span><span>●●● ᯤ 92%</span></div><div class="app" id="app"><section class="screen"><div class="card" style="margin-top:40px"><h1>Prototyp wird geladen …</h1><p>Bleibt diese Meldung sichtbar, blockiert die Dateivorschau JavaScript. Starte dann <b>PROTOTYP_STARTEN.cmd</b>.</p></div></section></div></main></div>
  <div class="dev-state" id="devState"></div>
  <nav class="palette-switcher" id="paletteSwitcher" aria-label="Farboption für Variante C"><strong>Farbe</strong><button data-palette="lime" style="--swatch:#b7f36b">Lime</button><button data-palette="ocean" style="--swatch:#58d7ff">Ocean</button><button data-palette="coral" style="--swatch:#ff906d">Coral</button><button data-palette="violet" style="--swatch:#dfa1ff">Violet</button></nav>
  <nav class="switcher" aria-label="Prototyp-Stil wechseln"><button id="prev" aria-label="Vorheriger Stil">←</button><div class="label"><b id="variantLabel"></b><small>← → oder klicken</small></div><button id="next" aria-label="Nächster Stil">→</button></nav>
  <script id="prototype-script-source">
    (()=>{
    if(globalThis.__macroAdvisorPrototypeLoaded)return;
    globalThis.__macroAdvisorPrototypeLoaded=true;
    const variants={A:'A · Ruhig & klar',B:'B · Editorial & warm',C:'C · Focus & data'};
    const palettes={lime:'Lime',ocean:'Ocean',coral:'Coral',violet:'Violet'};
    const query=new URLSearchParams(location.search);
    const state={screen:'today',sheet:null,saved:false,variant:(query.get('variant')||'A').toUpperCase(),palette:(query.get('palette')||'lime').toLowerCase()};
    if(!variants[state.variant]) state.variant='A';
    if(!palettes[state.palette]) state.palette='lime';
    const app=document.querySelector('#app');
    function setVariant(v){state.variant=v;document.body.dataset.v=v;try{const u=new URL(location.href||location);u.searchParams.set('variant',v);history.replaceState({},'',u)}catch(_){/* Some file previews block History API writes. The prototype still works. */}render()}
    function setPalette(p){if(!palettes[p])return;state.palette=p;document.body.dataset.palette=p;try{const u=new URL(location.href||location);u.searchParams.set('palette',p);history.replaceState({},'',u)}catch(_){/* File previews may block History API writes. */}render()}
    function cycle(d){const keys=Object.keys(variants),i=keys.indexOf(state.variant);setVariant(keys[(i+d+keys.length)%keys.length])}
    function top(title,sub='',back=false){return `<header class="top">${back?`<button class="icon" data-action="today" aria-label="Zurück">←</button>`:''}<div><div class="eyebrow">${sub}</div><h1>${title}</h1></div><span class="spacer"></span>${!back?`<button class="icon" data-action="history" aria-label="Verlauf">↗</button><button class="icon" data-action="settings" aria-label="Einstellungen">⚙</button>`:''}</header>`}
    const macros=()=>`<div class="macros"><div class="card macro"><span>Protein</span><strong>86 g</strong><div class="bar"><i style="--p:72%;--tone:#5e8bf4"></i></div></div><div class="card macro"><span>Kohlenhydrate</span><strong>164 g</strong><div class="bar"><i style="--p:61%;--tone:#e5a03d"></i></div></div><div class="card macro"><span>Fett</span><strong>54 g</strong><div class="bar"><i style="--p:78%;--tone:#bf6ecc"></i></div></div></div>`;
    const meal=(emoji,name,detail,kcal)=>`<button class="card meal" data-action="detail" style="width:100%;color:inherit;text-align:left"><span class="meal-art">${emoji}</span><span class="meal-copy"><b>${name}</b><small>${detail}</small></span><span class="meal-kcal"><b>${kcal}</b><small>kcal</small></span></button>`;
    function today(){return `<section class="screen">${top('Heute','Dienstag · 15. September')}<div class="date-strip"><button aria-label="Vortag">‹</button><div class="date-main"><b>Heute</b><small>15. September 2026</small></div><button aria-label="Nächster Tag">›</button></div><div class="dashboard"><div class="left"><div class="card hero"><div class="eyebrow">Tagesenergie</div><div class="kcal">1.742 <span class="unit">kcal</span></div><p>Noch 458 bis zum Tagesziel</p><div class="ring"></div></div>${macros()}<div class="section-title"><h2>Ziele</h2><button data-action="settings">Anpassen</button></div><div class="card"><div class="total-row"><span>Ballaststoffe</span><b>21 / 30 g</b></div><div class="bar"><i style="--p:70%"></i></div><div class="total-row"><small>Unter Minimum</small><small>9 g verbleibend</small></div></div></div><div class="right"><div class="section-title"><h2>Mahlzeiten & Getränke</h2><button data-action="history">Verlauf</button></div>${meal('🥣','Hafer-Porridge','08:10 · Hafer, Beeren, Joghurt','482')}${meal('🥗','Linsen-Bowl','12:35 · Linsen, Gemüse, Feta','694')}${meal('🍝','Pasta Primavera','19:04 · Pasta, Gemüse, Parmesan','566')}<div class="notice"><span>ⓘ</span><div><b>Schätzwerte</b>Nährwerte können unvollständig sein. Du kannst jede Mahlzeit prüfen und ändern.</div></div></div></div></section><nav class="bottomnav"><button class="active" data-action="today"><b>⌂</b>Heute</button><button data-action="history"><b>⌁</b>Verlauf</button></nav><button class="fab" data-action="capture"><span>＋</span><em>Mahlzeit erfassen</em></button>`}
    function capture(){return `<section class="screen">${top('Mahlzeit beschreiben','Neue Schätzung',true)}<div class="notice"><span>✦</span><div><b>Erst schätzen, dann prüfen</b>Du bestätigst oder änderst alle Werte, bevor sie gespeichert werden.</div></div><label class="form-label" for="desc">Was hast du gegessen oder getrunken?</label><textarea id="desc" class="textarea">Eine große Linsen-Bowl mit Ofengemüse, Feta und Zitronendressing</textarea><label class="form-label">Zeitpunkt</label><button class="choice"><i>◷</i><span><b>Heute, 20:15</b><small>Tippen zum Ändern</small></span></button><button class="primary" data-action="analyze">Nährwerte schätzen ✦</button><button class="secondary" data-action="source">Andere Eingabe wählen</button></section>`}
    function review(){return `<section class="screen">${top('Schätzung prüfen','Vor dem Speichern',true)}<div class="notice"><span>◉</span><div><b>Mittlere Sicherheit</b>Portionsgrößen und Dressing wurden geschätzt. <u>Annahmen ansehen</u></div></div><div class="section-title"><h2>Erkannte Bestandteile</h2><button data-action="add">＋ Hinzufügen</button></div><div class="card"><button class="item-row" data-action="edit" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;color:inherit;text-align:left"><span><b>Linsen, gekocht</b><small>220 g · hohe Sicherheit</small></span><b>255 kcal ›</b></button><button class="item-row" data-action="edit" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;color:inherit;text-align:left"><span><b>Ofengemüse</b><small>180 g · mittlere Sicherheit</small></span><b>132 kcal ›</b></button><button class="item-row" data-action="edit" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;color:inherit;text-align:left"><span><b>Feta & Dressing</b><small>85 g · niedrige Sicherheit</small></span><b>307 kcal ›</b></button></div><div class="section-title"><h2>Gesamt</h2><span>3 Bestandteile</span></div><div class="card"><div class="total-row"><span>Energie</span><b>694 kcal</b></div><div class="total-row"><span>Protein</span><b>31 g</b></div><div class="total-row"><span>Kohlenhydrate</span><b>78 g</b></div><div class="total-row"><span>Fett</span><b>29 g</b></div><div class="total-row"><span>Ballaststoffe</span><b>22 g</b></div></div><button class="primary" data-action="save">Bestätigen & speichern</button><button class="secondary" data-action="capture">Beschreibung ändern</button></section>`}
    function historyScreen(){let hs=[52,70,43,81,64,94,76];return `<section class="screen">${top('Verlauf','Nur auf diesem Gerät',true)}<div class="seg"><button class="active">7 Tage</button><button>Monat</button><button>Zeitraum</button></div><div class="section-title"><h2>Protein</h2><button>Nährstoff ▾</button></div><div class="card"><div class="eyebrow">Ø 78 g pro Tag</div><div class="chart">${hs.map((h,i)=>`<div class="col"><i style="--h:${h}%;--o:${i===6?1:.55}"></i>${['Mi','Do','Fr','Sa','So','Mo','Heute'][i]}</div>`).join('')}</div></div><div class="notice" style="margin-top:12px"><span>↯</span><div><b>Trend ohne Wertung</b>Höchster vollständiger Wert: 96 g am Montag. Ein Tag enthält unvollständige Daten.</div></div><div class="section-title"><h2>Tageswerte</h2></div>${['Heute · 86 g|Im Ziel','Mo, 14. Sep · 96 g|Im Ziel','So, 13. Sep · 68 g|Unter Minimum'].map(x=>{let [a,b]=x.split('|');return `<div class="setting"><div class="sicon">◷</div><div><b>${a}</b><small>${b}</small></div><span>›</span></div>`}).join('')}</section>`}
    function settings(){return `<section class="screen">${top('Einstellungen','Privat & lokal',true)}<div class="section-title"><h2>Deine Einrichtung</h2></div><div class="card"><div class="setting"><div class="sicon">✦</div><div><b>KI-Anbieter</b><small>Gemini · verbunden</small></div><span>›</span></div><button class="setting" data-action="goals" style="width:100%;border-left:0;border-right:0;border-top:0;background:none;color:inherit;text-align:left"><div class="sicon">⚑</div><div><b>Tagesziele</b><small>3 Ziele aktiv</small></div><span>›</span></button><div class="setting"><div class="sicon">文</div><div><b>Sprache</b><small>Deutsch</small></div><span>›</span></div></div><div class="section-title"><h2>Datenschutz</h2></div><div class="card"><div class="setting"><div class="sicon">▧</div><div><b>Gespeicherte Essensbilder</b><small>Kleine lokale Bilder behalten</small></div><button class="toggle" aria-label="Bilder speichern eingeschaltet"></button></div><div class="setting"><div class="sicon">⌂</div><div><b>Lokale Daten</b><small>Mahlzeiten verlassen dieses Gerät nicht</small></div></div></div><div class="section-title"><h2>Über die App</h2></div><div class="notice"><span>ⓘ</span><div><b>Schätzungen, keine Messwerte</b>MacroAdvisor bietet keine medizinische oder Ernährungsberatung.</div></div></section>`}
    function detail(){return `<section class="screen">${top('Linsen-Bowl','Heute · 12:35',true)}<div class="card hero"><div class="eyebrow">Gesamtenergie</div><div class="kcal">694 <span class="unit">kcal</span></div><p>Nach der Schätzung nicht bearbeitet</p></div><div class="notice"><span>◉</span><div><b>Mittlere Sicherheit</b>Die Werte beruhen auf Portionsannahmen und können abweichen.</div></div><div class="section-title"><h2>Bestandteile</h2><button data-action="edit">Bearbeiten</button></div><div class="card"><div class="item-row"><span><b>Linsen, gekocht</b><small>220 g</small></span><b>255 kcal</b></div><div class="item-row"><span><b>Ofengemüse</b><small>180 g</small></span><b>132 kcal</b></div><div class="item-row"><span><b>Feta & Dressing</b><small>85 g</small></span><b>307 kcal</b></div></div><button class="secondary" data-action="today">Zurück zu Heute</button></section>`}
    function goals(){return `<section class="screen">${top('Tagesziele','Transparent & anpassbar',true)}<div class="notice"><span>⚑</span><div><b>Deine Ziele, deine Werte</b>Ziele beschreiben Fortschritt und sind keine medizinische Empfehlung.</div></div>${[['Energie','Maximum','2.200 kcal'],['Protein','Minimum','120 g'],['Ballaststoffe','Minimum','30 g'],['Kohlenhydrate','Aus','—'],['Fett','Aus','—']].map(x=>`<div class="setting"><div><b>${x[0]}</b><small>${x[1]}</small></div><span class="spacer"></span><b>${x[2]}</b><span>›</span></div>`).join('')}<button class="primary" data-action="settings">Ziele speichern</button></section>`}
    function sheet(){return `<div class="sheet-wrap"><div class="sheet"><div class="grab"></div><button class="icon close" data-action="close" aria-label="Schließen">×</button><h2>Wie möchtest du starten?</h2><p>Du prüfst die Schätzung immer vor dem Speichern.</p><button class="choice" data-action="capture"><i>≡</i><span><b>Mahlzeit beschreiben</b><small>Schnell mit eigenen Worten</small></span></button><button class="choice" data-action="photo"><i>◉</i><span><b>Foto aufnehmen</b><small>Kamera öffnet erst nach Auswahl</small></span></button><button class="choice" data-action="photo"><i>▧</i><span><b>Foto auswählen</b><small>Ein Bild aus der Mediathek</small></span></button></div></div>`}
    function success(){return `<section class="screen success"><div class="check">✓</div><h1>Gespeichert</h1><p>Die Linsen-Bowl wurde zu Heute hinzugefügt.</p><button class="primary" data-action="today">Zu Heute</button></section>`}
    function render(){document.body.dataset.v=state.variant;document.body.dataset.palette=state.palette;document.querySelector('#variantLabel').textContent=variants[state.variant];document.querySelectorAll('[data-palette]').forEach(b=>{const active=b.dataset.palette===state.palette;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});app.innerHTML=({today, capture,review,history:historyScreen,settings,detail,goals,success}[state.screen]||today)()+(state.sheet?sheet():'');document.querySelector('#devState').innerHTML=`PROTOTYP · nicht Produktion<br>variant: ${state.variant}<br>palette: ${state.palette}<br>screen: ${state.screen}<br>overlay: ${state.sheet||'none'}`}
    document.addEventListener('click',e=>{const paletteButton=e.target.closest('[data-palette]');if(paletteButton){setPalette(paletteButton.dataset.palette);return}const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action;if(a==='source'||a==='close'){state.sheet=a==='source'?'source':null}else if(a==='photo'){state.sheet=null;state.screen='review'}else if(a==='analyze'){b.textContent='Schätzung läuft …';setTimeout(()=>{state.screen='review';render()},650);return}else if(a==='save'){state.screen='success'}else if(a==='add'||a==='edit'){alert('Im Flutter-Produkt öffnet sich hier die editierbare Bestandteilsansicht.')}else if(a==='capture'&&state.screen==='today'){state.sheet='source'}else{state.sheet=null;state.screen=a}render()});
    document.querySelector('#prev').onclick=()=>cycle(-1);document.querySelector('#next').onclick=()=>cycle(1);document.addEventListener('keydown',e=>{if(['INPUT','TEXTAREA'].includes(document.activeElement.tagName)||document.activeElement.isContentEditable)return;if(e.key==='ArrowLeft')cycle(-1);if(e.key==='ArrowRight')cycle(1)});render();
    })();
  </script>
</body>
</html>
